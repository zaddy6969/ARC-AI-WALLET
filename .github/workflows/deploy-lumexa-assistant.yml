name: Deploy Lumexa Assistant to Arc Testnet

on:
  push:
    branches:
      - main
    paths:
      - "contracts/LumexaWalletAssistant.sol"
      - "scripts/deploy-assistant.js"
      - "scripts/verify-assistant-deployment.js"
      - "hardhat.config.js"
      - "package.json"
      - ".github/workflows/deploy-lumexa-assistant.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lumexa-assistant-arc-testnet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify deployment secret
        env:
          ARC_TESTNET_PRIVATE_KEY: ${{ secrets.ARC_TESTNET_PRIVATE_KEY }}
        run: |
          if [ -z "$ARC_TESTNET_PRIVATE_KEY" ]; then
            echo "::error::GitHub Actions secret ARC_TESTNET_PRIVATE_KEY is required to deploy LumexaWalletAssistant to Arc Testnet."
            exit 1
          fi

      - name: Compile contract
        run: pnpm contract:compile

      - name: Build production app
        run: pnpm build

      - name: Deploy and verify LumexaWalletAssistant
        env:
          ARC_TESTNET_PRIVATE_KEY: ${{ secrets.ARC_TESTNET_PRIVATE_KEY }}
          ARC_TESTNET_RPC_URL: https://rpc.testnet.arc.network
          ARC_TESTNET_EXPLORER_URL: https://testnet.arcscan.app
          ARC_DEPLOYMENT_CONFIRMATIONS: "1"
          LUMEXA_ASSISTANT_NAME: Lumexa AI Agent
        run: pnpm contract:deploy:arc

      - name: Re-verify deployment from Arc RPC
        env:
          ARC_TESTNET_RPC_URL: https://rpc.testnet.arc.network
        run: pnpm contract:verify:arc

      - name: Validate verified deployment metadata
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'lib/generated/lumexa-assistant-deployment.json';
          const deployment = JSON.parse(fs.readFileSync(file, 'utf8'));

          if (deployment.chainId !== 5042002) {
            throw new Error(`Unexpected chain ID: ${deployment.chainId}`);
          }
          if (!/^0x[a-fA-F0-9]{40}$/.test(deployment.address || '')) {
            throw new Error('Deployment did not produce a valid contract address.');
          }
          if (!/^0x[a-fA-F0-9]{64}$/.test(deployment.txHash || '')) {
            throw new Error('Deployment did not produce a valid transaction hash.');
          }
          if (deployment.verification?.status !== 'verified') {
            throw new Error('Deployment metadata is not marked as onchain verified.');
          }
          if (deployment.verification?.receiptStatus !== 1) {
            throw new Error('Deployment receipt is not successful.');
          }
          if (!deployment.verification?.runtimeCodeHash) {
            throw new Error('Deployment metadata is missing runtime bytecode verification.');
          }
          if (!deployment.txExplorerUrl?.startsWith('https://testnet.arcscan.app/tx/')) {
            throw new Error('Deployment metadata is missing the official ArcScan transaction URL.');
          }

          console.log(`Verified LumexaWalletAssistant: ${deployment.address}`);
          console.log(`Verified deployment transaction: ${deployment.txHash}`);
          console.log(`ArcScan: ${deployment.txExplorerUrl}`);
          NODE

      - name: Commit verified deployment metadata
        run: |
          if git diff --quiet -- lib/generated/lumexa-assistant-deployment.json; then
            echo "Deployment metadata is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/generated/lumexa-assistant-deployment.json
          git commit -m "Record verified Lumexa Arc deployment"
          git push origin HEAD:main
